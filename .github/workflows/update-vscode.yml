name: update-vscode

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run update script
        id: update
        run: |
          before=$(jq -r '.stable.commit' versions.json)
          ./scripts/update-vscode-sha256.sh
          after=$(jq -r '.stable.commit' versions.json)
          if [[ "$before" == "$after" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No upstream change (still ${before:0:7})."
          else
            version=$(jq -r '.stable.version' versions.json)
            short=${after:0:7}
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "commit=$after"   >> "$GITHUB_OUTPUT"
            echo "short=$short"    >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request
        id: cpr
        if: steps.update.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GH_TOKEN }}
          branch: chore/update-vscode-${{ steps.update.outputs.short }}
          commit-message: "chore: bump VS Code to ${{ steps.update.outputs.version }} (${{ steps.update.outputs.short }})"
          title: "chore: bump VS Code to ${{ steps.update.outputs.version }}"
          body: |
            VS Code CLI auto-update from scheduled workflow.

            - version: `${{ steps.update.outputs.version }}`
            - commit: `${{ steps.update.outputs.commit }}`

            sha256 fetched by downloading the tarball at `commit:${{ steps.update.outputs.commit }}` and computing locally — matches the pinned commit, not a moving "latest" pointer.
          labels: |
            dependencies
            vscode-update

      # Auto-merge is server-side: GitHub holds the merge until the required
      # status checks on main (lint, build) pass. It does not merge early even
      # with an admin PAT, so this is the actual gate.
      - name: Enable auto-merge
        if: steps.cpr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: gh pr merge --squash --auto '${{ steps.cpr.outputs.pull-request-number }}'

      # Watching only reports: it fails this run so a check failure is visible
      # instead of leaving a silently stalled PR. The merge decision stays with
      # auto-merge above.
      - name: Report check results
        if: steps.cpr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          pr='${{ steps.cpr.outputs.pull-request-number }}'
          # Checks register a few seconds after the PR opens; without this wait
          # `gh pr checks` reports "no checks" and exits before they appear.
          for _ in $(seq 30); do
            if gh pr checks "$pr" >/dev/null 2>&1; then break; fi
            sleep 5
          done
          gh pr checks "$pr" --watch --fail-fast
